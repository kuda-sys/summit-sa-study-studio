/* v0.4 — cinematic page imagery and slow Ken Burns movement */
.screen:not(.welcome){position:relative;isolation:isolate;overflow:hidden}
.screen:not(.welcome)::before{content:"";position:absolute;inset:-2.5%;z-index:-1;pointer-events:none;background-image:linear-gradient(115deg,rgba(5,5,8,.94) 0%,rgba(5,5,8,.80) 45%,rgba(5,5,8,.91) 100%),var(--page-image,url('assets/photos/pexels-jeswin-5265389.jpg'));background-size:cover;background-position:center;opacity:.66;transform:scale(1.02);animation:ambientKenBurns 34s ease-in-out infinite alternate;will-change:transform}
.screen:not(.welcome)::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 15% 8%,rgba(41,151,255,.12),transparent 38%),radial-gradient(ellipse at 90% 70%,rgba(255,214,10,.08),transparent 35%)}

body[data-route="practice"] .screen{--page-image:url('assets/photos/pexels-andy-barbour-6683407.jpg')}

.page-hero-art{height:clamp(150px,23vw,285px);margin:0 0 30px;border-radius:26px;overflow:hidden;position:relative;border:1px solid #ffffff24;box-shadow:0 22px 65px #0006;background:#14151b}
.page-hero-art img{width:100%;height:100%;object-fit:cover;display:block;animation:heroKenBurns 28s ease-in-out infinite alternate;filter:saturate(1.08)}
.page-hero-art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,8,.86),rgba(5,5,8,.25) 70%,rgba(5,5,8,.2)),linear-gradient(0deg,rgba(5,5,8,.45),transparent 60%)}

.page-hero-copy span{display:block;margin-top:7px;color:#e1e1e7;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
@keyframes heroKenBurns{0%{transform:scale(1.02) translateX(0)}100%{transform:scale(1.15) translateX(-1.5%)}}

.content-panel,.path-card,.video-card,.topic-card,.progress-card,.welcome-strip{backdrop-filter:blur(12px)}
.content-panel{background:linear-gradient(140deg,rgba(21,21,25,.94),rgba(13,13,16,.91))}

/* v0.7 listening studio navigation and immersive player */
.video-card{cursor:pointer;transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}
.video-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 18px 45px #0007}
.video-thumb{display:block;position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#09090c;border:0;padding:0;cursor:pointer;color:white;text-align:left}
.video-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 8s ease;filter:saturate(.88)}
.video-card:hover .video-thumb img{transform:scale(1.08)}
.video-thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#050508a8,transparent 70%)}

.video-card:hover .video-play{transform:translate(-50%,-50%) scale(1.1)}
